name: ML CI

on:
  push:
    branches: [main, feat/postgres-pgvector-local-ai]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_helpdesk_test
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk -d ai_helpdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://helpdesk:ci_test_password@localhost:5432/ai_helpdesk_test
      RUN_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Audit dependency vulnerabilities
        run: |
          python -m venv "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/python" -m pip install --no-cache-dir --disable-pip-version-check pip-audit==2.10.1
          "$RUNNER_TEMP/audit-venv/bin/pip-audit" -r requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q .
      - run: python train.py
      - name: Run tests (SQLite unit tests + PostgreSQL/pgvector integration)
        run: python -m pytest
